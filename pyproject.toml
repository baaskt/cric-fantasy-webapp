[tool]
[tool.poetry]
name = "cric-fantasy-backend"
version = "0.1.0"
description = ""
authors = ["Thilakaraj K <nmrkthilakraj@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
python-decouple = "^3.8"
pandas = "^2.1.3"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
flask-restx = "1.3.0"
requests = "^2.31.0"
apscheduler = "^3.10.4"
firebase-admin = "^6.4.0"
flask-cors = "^4.0.0"
passlib = "^1.7.4"
python-dotenv = "^1.0.1"

[tool.poetry.group]
[tool.poetry.group.dev]
[tool.poetry.group.dev.dependencies]
pre-commit = "^3.5.0"
pylint = "^3.0.2"
mongomock-motor = "^0.0.21"
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
coverage = "^7.3.2"
pytest-env = "^1.1.1"
pycodestyle = "^2.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.'MESSAGES CONTROL']
disable = """
    too-many-arguments,
    not-callable,
    missing-class-docstring,
    missing-function-docstring,
    missing-module-docstring,
    no-name-in-module,
    arguments-differ,
    invalid-overridden-method
"""
